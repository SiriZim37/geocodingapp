apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.fabric'
apply plugin: 'realm-android'

android {
    compileSdkVersion 28
    defaultConfig {
        applicationId "com.tlt.georepo"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 17
        versionName "0.5"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    flavorDimensions "default"
    productFlavors {
        dev {
            buildConfigField "String", "BASE_URL", "\"https://ilab.tlt.co.th/geocodingapi/api/\""
            buildConfigField "String", "APP_NAME", "\"GEO Collection\""
            buildConfigField "String", "LINE_CHANNEL_ID", "\"\""
            buildConfigField "String", "POLICY_URL", "\"https://wa4api.tlt.co.th/TLTMobiAPI/TLTTermCon.html\""
            buildConfigField "String", "DISCLOSURE_URL", "\"https://wa4api.tlt.co.th/TLTMOBIAPI/TLTDisclosure.html\""
            buildConfigField "boolean", "IS_AUTOMATE_TEST_MODE", "false"
            buildConfigField "String", "FCM_GEO_TOPIC_ANDROID", "\"GEO_COLLECTION_ANDROID\""
            buildConfigField "String", "FCM_GEO_TOPIC", "\"GEO_COLLECTION\""
            resValue "string", "app_name", "GEO Collection (DEV)"
            applicationId "com.tlt.georepo"
        }

        devAutomateTest {
            buildConfigField "String", "BASE_URL", "\"https://ilab.tlt.co.th/geocodingapi/api/\""
            buildConfigField "String", "APP_NAME", "\"GEO Collection\""
            buildConfigField "String", "LINE_CHANNEL_ID", "\"\""
            buildConfigField "String", "POLICY_URL", "\"https://wa4api.tlt.co.th/TLTMobiAPI/TLTTermCon.html\""
            buildConfigField "String", "DISCLOSURE_URL", "\"https://wa4api.tlt.co.th/TLTMOBIAPI/TLTDisclosure.html\""
            buildConfigField "boolean", "IS_AUTOMATE_TEST_MODE", "true"
            buildConfigField "String", "FCM_GEO_TOPIC_ANDROID", "\"GEO_COLLECTION_ANDROID\""
            buildConfigField "String", "FCM_GEO_TOPIC", "\"GEO_COLLECTION\""
            resValue "string", "app_name", "GEO Collection (DEV)"
            applicationIdSuffix ".develop"
        }

        production {
            buildConfigField "String", "BASE_URL", "\"https://ilab.tlt.co.th/geocodingapi/api/\""
            buildConfigField "String", "APP_NAME", "\"GEO Collection\""
            buildConfigField "String", "LINE_CHANNEL_ID", "\"\""
            buildConfigField "String", "POLICY_URL", "\"https://wa4api.tlt.co.th/TLTMobiAPI/TLTTermCon.html\""
            buildConfigField "String", "DISCLOSURE_URL", "\"https://wa4api.tlt.co.th/TLTMOBIAPI/TLTDisclosure.html\""
            buildConfigField "boolean", "IS_AUTOMATE_TEST_MODE", "false"
            buildConfigField "String", "FCM_GEO_TOPIC_ANDROID", "\"GEO_COLLECTION_ANDROID\""
            buildConfigField "String", "FCM_GEO_TOPIC", "\"GEO_COLLECTION\""
            resValue "string", "app_name", "GEO Collection"
        }

    }

    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    signingConfigs {
        release {
            storeFile file("geokeystore.jks")
            keyAlias "geokeystore"
            storePassword "Toyota1!"
            keyPassword "Toyota1!"
        }
    }

    buildTypes {

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    sourceSets { main { resources.srcDirs = ['src/main/resources', 'src/test/resources/'] } }
    buildToolsVersion '28.0.3'

    // Temporary fix until alpha10
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
    }

}


ext {
    support_lib_version = '28.0.0'
    firebase_service_version = '15.0.2'
    retrofit_version = '2.3.0'
    lottieVersion = '2.6.1'
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation "com.android.support:support-v4:$support_lib_version"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.android.support:appcompat-v7:$support_lib_version"
    implementation "com.android.support:recyclerview-v7:$support_lib_version"
    implementation "com.android.support:design:$support_lib_version"
    implementation "com.android.support:support-v4:$support_lib_version"
    implementation "com.android.support:exifinterface:$support_lib_version"
    implementation "com.android.support:support-v4:$support_lib_version"
    annotationProcessor "android.arch.lifecycle:compiler:1.1.1"
    implementation 'com.google.firebase:firebase-messaging:17.0.0'
    implementation 'com.google.firebase:firebase-core:16.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.2'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'com.crashlytics.sdk.android:crashlytics:2.9.5'
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-scalars:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    debugImplementation 'com.readystatesoftware.chuck:library:1.1.0'
    releaseImplementation 'com.readystatesoftware.chuck:library-no-op:1.1.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.10.0'
    implementation('com.github.bumptech.glide:glide:4.6.1') {
        exclude group: "com.android.support"
    }

